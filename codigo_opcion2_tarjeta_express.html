<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tarjeta Digital VIP Stellantis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --accent-cyan: #00e5ff;
      --accent-blue: #0d6efd;
      --dark-card: rgba(10, 20, 38, 0.78);
      --border-glow: rgba(0, 229, 255, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      font-family: 'Montserrat', sans-serif;
      background-color: #07101e;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 14px;
      
      /* 🖼️ FONDO DE LUJO (Coloca aquí la imagen que desees) */
      background-image: 
        radial-gradient(circle at 50% 10%, rgba(0, 229, 255, 0.18) 0%, transparent 65%),
        linear-gradient(180deg, rgba(7, 16, 30, 0.85) 0%, rgba(7, 16, 30, 0.95) 100%),
        url('https://res.cloudinary.com/dbxa0pozm/image/upload/f_auto,q_auto/v1787360198/fondo_escritorio_imagen_1_ul1thk.png');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    .express-card {
      width: 100%;
      max-width: 460px;
      background: var(--dark-card);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--border-glow);
      border-radius: 26px;
      padding: 34px 22px;
      text-align: center;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7), 0 0 40px rgba(0, 229, 255, 0.15);
      animation: slideUp 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* AVATAR / ICONO DE BIENVENIDA */
    .avatar-wrap {
      position: relative;
      width: 80px;
      height: 80px;
      margin: 0 auto 18px auto;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      color: #fff;
      box-shadow: 0 0 25px rgba(0, 229, 255, 0.5);
    }

    .avatar-wrap::after {
      content: "";
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      border: 2px dashed rgba(0, 229, 255, 0.5);
      animation: spinBorder 12s linear infinite;
    }

    @keyframes spinBorder {
      100% { transform: rotate(360deg); }
    }

    .badge-card {
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--accent-cyan);
      background: rgba(0, 229, 255, 0.1);
      padding: 5px 14px;
      border-radius: 20px;
      display: inline-block;
      margin-bottom: 12px;
      border: 1px solid rgba(0, 229, 255, 0.3);
    }

    .card-title {
      font-size: 1.65rem;
      font-weight: 800;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }

    .card-sub {
      font-size: 0.88rem;
      color: #94a3b8;
      margin-bottom: 24px;
      line-height: 1.4;
    }

    /* LISTA DE ACCIONES PRINCIPALES */
    .links-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 22px;
    }

    .action-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 16px 20px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 16px;
      color: #ffffff !important;
      text-decoration: none !important;
      font-size: 0.95rem;
      font-weight: 700;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
    }

    .action-btn:hover {
      background: rgba(0, 229, 255, 0.15);
      border-color: var(--accent-cyan);
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0, 229, 255, 0.25);
    }

    .action-btn .btn-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .action-btn .btn-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      color: var(--accent-cyan);
      transition: all 0.25s ease;
    }

    .action-btn:hover .btn-icon {
      background: var(--accent-cyan);
      color: #07101e;
    }

    .action-btn .btn-arrow {
      color: #64748b;
      font-size: 0.85rem;
      transition: all 0.25s ease;
    }

    .action-btn:hover .btn-arrow {
      color: var(--accent-cyan);
      transform: translateX(4px);
    }

    /* BOTÓN DESTACADO PRINCIPAL */
    .action-btn.featured {
      background: linear-gradient(135deg, #00d2ff 0%, #0066ff 100%);
      border: none;
      box-shadow: 0 0 25px rgba(0, 229, 255, 0.5);
      position: relative;
      overflow: hidden;
    }

    .action-btn.featured:hover {
      box-shadow: 0 0 40px rgba(0, 229, 255, 0.8);
      transform: translateY(-3px) scale(1.02);
    }

    .action-btn.featured .btn-icon {
      background: rgba(255, 255, 255, 0.22);
      color: #fff;
    }

    .action-btn.featured .btn-arrow {
      color: #fff;
    }

    /* BOTÓN WHATSAPP */
    .action-btn.whatsapp {
      background: rgba(37, 211, 102, 0.12);
      border-color: rgba(37, 211, 102, 0.35);
      color: #25d366 !important;
    }

    .action-btn.whatsapp:hover {
      background: rgba(37, 211, 102, 0.25);
      border-color: #25d366;
      box-shadow: 0 8px 25px rgba(37, 211, 102, 0.3);
    }

    .action-btn.whatsapp .btn-icon {
      background: rgba(37, 211, 102, 0.2);
      color: #25d366;
    }

    .card-footer {
      font-size: 0.74rem;
      color: #64748b;
      margin-top: 14px;
    }
  </style>
</head>
<body>

  <div class="express-card">
    
    <!-- ICONO VIP -->
    <div class="avatar-wrap">
      <i class="fa-solid fa-car-side"></i>
    </div>

    <span class="badge-card">Tarjeta Digital</span>
    <h2 class="card-title">Asesoría Stellantis</h2>
    <p class="card-sub">Selecciona una opción para acceder directamente:</p>

    <div class="links-list">
      
      <!-- BOTÓN 1: DESTACADO / SHOWROOM COMPLETO -->
      <a href="https://lfmtz.github.io/landing-stellantis/" target="_top" class="action-btn featured">
        <div class="btn-left">
          <div class="btn-icon"><i class="fa-solid fa-sparkles"></i></div>
          <span>Ver Catálogo y Promociones</span>
        </div>
        <i class="fa-solid fa-chevron-right btn-arrow"></i>
      </a>

      <!-- BOTÓN 2: OFERTAS DEL MES -->
      <a href="https://lfmtz.github.io/landing-stellantis/#promociones" target="_top" class="action-btn">
        <div class="btn-left">
          <div class="btn-icon"><i class="fa-solid fa-tag"></i></div>
          <span>Ofertas Destacadas del Mes</span>
        </div>
        <i class="fa-solid fa-chevron-right btn-arrow"></i>
      </a>

      <!-- BOTÓN 3: AUTOS DEMO -->
      <a href="https://lfmtz.github.io/landing-stellantis/paginas_promo/promo-demos.html" target="_top" class="action-btn">
        <div class="btn-left">
          <div class="btn-icon"><i class="fa-solid fa-car-tunnel"></i></div>
          <span>Autos Demo con Bono Especial</span>
        </div>
        <i class="fa-solid fa-chevron-right btn-arrow"></i>
      </a>

      <!-- BOTÓN 4: WHATSAPP DIRECTO -->
      <a href="https://wa.me/525521787900?text=Hola,%20tengo%20tu%20tarjeta%20y%20quiero%20cotizar%20un%20vehiculo%20Stellantis." target="_top" class="action-btn whatsapp">
        <div class="btn-left">
          <div class="btn-icon"><i class="fa-brands fa-whatsapp"></i></div>
          <span>WhatsApp con mi Asesor</span>
        </div>
        <i class="fa-solid fa-chevron-right btn-arrow"></i>
      </a>

    </div>

    <p class="card-footer">
      <i class="fa-solid fa-lock me-1"></i> RAM • JEEP • DODGE • PEUGEOT • FIAT
    </p>

  </div>

</body>
</html>
