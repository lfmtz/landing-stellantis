<!DOCTYPE html>
<html lang="es">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;700&amp;display=swap" rel="stylesheet"/>
  <title>Promociones LEAPMOTOR</title>
  <style>
    :root {
      --acento: #3B93A9;
      --fondo-inv: #FFF6F2;
      --borde-inv: #ffd9c7;
      --gris-suave: #F4F4F4;
      --gris-texto: #666666;
      --texto-minimo: #999999;
      --fuente: 'Barlow Condensed', sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .grid-promos {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      padding: 10px;
      max-width: 960px;
      margin: 0 auto;
    }

    @media (max-width: 700px) {
      .grid-promos {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: #fff;
      border: 1px solid #E0E0E0;
      border-top: 5px solid var(--acento);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
    }

    .img-container {
      width: 100%;
      padding-top: 75%;
      position: relative;
      background: #f5f5f5;
    }

    .card-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #f5f5f5;
    }

    .card-header {
      padding: 12px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #eee;
      gap: 8px;
    }

    .model-name {
      font-family: var(--fuente);
      font-size: clamp(1rem, 3vw, 1.3rem);
      font-weight: 700;
      text-transform: uppercase;
      margin: 0;
      color: #111;
    }

    .model-price {
      font-family: var(--fuente);
      font-size: 1.1rem;
      font-weight: 700;
    }

    .btn-wa {
      color: #fff;
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: var(--fuente);
      font-weight: 700;
      font-size: 0.85rem;
      text-transform: uppercase;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .promo-body {
      padding: 15px;
      flex-grow: 1;
      display: flex;
      box-sizing: border-box;
      flex-direction: column;
    }

    .promo-main {
      font-family: var(--fuente);
      line-height: 1.4;
      background: var(--gris-suave);
      padding: 12px;
      border-radius: 4px;
      margin-bottom: 12px;
    }

    .benefits-list {
      list-style: none;
      padding: 0;
      margin: 0 0 12px 0;
      font-family: var(--fuente);
    }

    .benefits-list li {
      font-size: 0.9rem;
      margin-bottom: 5px;
      color: var(--gris-texto);
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .benefits-list li::before {
      content: "✓";
      color: var(--acento-list, var(--acento));
      font-weight: bold;
      flex-shrink: 0;
    }

    .legal {
      font-size: 0.72rem;
      color: var(--texto-minimo);
      margin-top: auto;
      padding-top: 10px;
      font-family: var(--fuente);
      line-height: 1.4;
    }

    .embed-footer {
      height: 12px;
    }

    .no-promos {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px;
      font-family: var(--fuente);
      font-size: 1.2rem;
      color: var(--gris-texto);
      background: #fafafa;
      border: 1px dashed #ccc;
      border-radius: 8px;
    }
  </style>
 </head>
 <body>
  <div class="grid-promos">
    <div class="no-promos">No hay promociones activas actualmente para esta marca.</div>
  </div>
  <div class="embed-footer"></div>

  <!-- Popup de Arrendamiento (Vanilla CSS/JS Ligero) -->
  <div id="leasingPopup" class="leasing-popup-overlay" style="display: none;">
    <div class="leasing-popup-content">
      <button class="leasing-popup-close" id="closeLeasingPopup" aria-label="Cerrar">&times;</button>
      <a href="https://wa.me/525521787900?text=Hola,%20solicito%20información%20sobre%20el%20arrendamiento" target="_blank" id="leasingPopupLink">
        <!-- Para cambiar la imagen del popup cambia la ruta de abajo -->
        <img src="../imagenes/popup_arrendamiento.jpg" class="leasing-popup-img" alt="Promoción Especial Arrendamiento" onerror="this.onerror=null; this.src='../imagenes/carrusel_1.jpg';">
      </a>
    </div>
  </div>

  <style>
    /* Estilos del Popup de Arrendamiento */
    .leasing-popup-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 99999;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    .leasing-popup-overlay.show {
      opacity: 1;
    }
    .leasing-popup-content {
      position: relative;
      max-width: 420px; /* Ajustado para imágenes verticales / alargadas */
      width: 100%;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0, 229, 255, 0.3);
      border: 1px solid rgba(0, 229, 255, 0.4);
      background: #000;
      transform: scale(0.9);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .leasing-popup-overlay.show .leasing-popup-content {
      transform: scale(1);
    }
    .leasing-popup-img {
      width: 100%;
      height: auto;
      display: block;
      transition: transform 0.3s ease;
    }
    .leasing-popup-img:hover {
      transform: scale(1.02);
    }
    .leasing-popup-close {
      position: absolute;
      top: 15px;
      right: 15px;
      background: rgba(0, 0, 0, 0.7);
      border: 2px solid #fff;
      color: #fff;
      font-size: 24px;
      font-weight: bold;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999999 !important;
      pointer-events: auto !important;
      transition: background 0.3s, color 0.3s, border-color 0.3s;
    }
    .leasing-popup-close:hover {
      background: #00e5ff;
      color: #000;
      border-color: #00e5ff;
    }
  </style>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      var wasShown = localStorage.getItem('leasing_popup_shown');
      var wasDismissed = sessionStorage.getItem('leasing_popup_dismissed');

      if (!wasShown && !wasDismissed) {
        setTimeout(function() {
          var popup = document.getElementById('leasingPopup');
          if (popup) {
            popup.style.display = 'flex';
            setTimeout(function() {
              popup.classList.add('show');
            }, 50);

            var closeBtn = document.getElementById('closeLeasingPopup');
            if (closeBtn) {
              closeBtn.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                closePopup();
              });
            }

            popup.addEventListener('click', function(e) {
              if (e.target === popup) {
                closePopup();
              }
            });

            document.getElementById('leasingPopupLink').addEventListener('click', function() {
              localStorage.setItem('leasing_popup_shown', 'true');
            });
          }
        }, 2000);
      }

      function closePopup() {
        var popup = document.getElementById('leasingPopup');
        if (popup) {
          popup.classList.remove('show');
          setTimeout(function() {
            popup.style.display = 'none';
            sessionStorage.setItem('leasing_popup_dismissed', 'true');
          }, 400);
        }
      }
    });
  </script>
 </body>
</html>
